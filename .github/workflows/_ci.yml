# Consumers configure setup and optional custom targets for reusable Swift CI.
# This workflow runs the required Verify and Extra Targets gates.
# Dead-code analysis runs only locally because its required uncached compilation
# overloads the runner pool. LINT_GATES in swift.mk enforces the CI exclusion.
# Caller workflows define triggers because GitHub does not allow them here.
name: CI

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: macos-latest
      xcode-version:
        type: string
        default: latest-stable
      # The targets input is a legacy JSON array alias for custom extra targets.
      # The required Verify gate runs in this workflow.
      targets:
        type: string
        default: '["lint","build","test","audit"]'
      # The extra-targets input accepts a JSON array of custom make targets.
      # Custom targets run after the shared required jobs.
      extra-targets:
        type: string
        default: '[]'
      # The extra-dirs input supplies build directories the detector cannot infer
      # from the build graph. Paths are relative to the repository root and
      # separated by spaces or newlines.
      extra-dirs:
        type: string
        default: ""
      # The setup target runs before each required job and once before the batch
      # of extra targets.
      setup-target:
        type: string
        default: ""
      # The workflow appends make-args verbatim to every make invocation.
      # CODE_SIGN_IDENTITY=- is an example argument.
      make-args:
        type: string
        default: ""
      brew-packages:
        type: string
        default: ""
      cache-profile:
        type: string
        default: safe
      cache-version:
        type: string
        default: v1
      # The workflow imports a Developer ID certificate before building.
      # Enabling certificate import requires the APPLE_DEVELOPER_ID_P12_* secrets.
      import-signing-cert:
        type: boolean
        default: false
      # The workflow installs a Developer ID provisioning profile before building.
      # Some app entitlements, including iCloud, require a provisioning profile.
      # Enabling profile installation requires APPLE_DEVELOPER_ID_PROFILE_BASE64.
      install-provisioning-profile:
        type: boolean
        default: false
      signing-identity-name:
        type: string
        default: ""
      # The release dry run can use a different signing identity from verify.
      # A downloadable app uses Developer ID signing. The app's CI uses Apple
      # Distribution signing because the runner is not a registered device and
      # only App Store profiles work there. An empty release-signing-identity-name
      # uses signing-identity-name unchanged.
      release-signing-identity-name:
        type: string
        default: ""
      apple-team-id:
        type: string
        default: ""
      extra-cache-paths:
        type: string
        default: ""
      fetch-depth:
        type: string
        default: "1"
      # Verify runs separate build, test, and quality stages before signed release
      # stages on one machine. The workflow publishes one named check run per stage.
      # Each pull request uses one macOS slot instead of two when a consumer enables
      # release-dry-run and removes `pull_request` from its release workflow.
      # The caller must grant `checks: write` because a called workflow cannot use
      # permissions the caller withholds.
      release-dry-run:
        type: boolean
        default: false
      # Ceiling for a Verify job that also runs the release stages. It replaces
      # timeout-minutes only while the release dry run actually runs. 90 because
      # the combined job is the verify half plus a release build that replays no
      # compile cache when the release command is a compound script: the engine's
      # own hosted run finished its three verify stages at 40 minutes and was
      # cancelled at a 60-minute ceiling mid release build.
      release-timeout-minutes:
        type: number
        default: 90
      # The release dry run notarizes artifacts selected by globs within dist-dir.
      # An empty pattern runs the release build without notarization.
      notarize-pattern:
        type: string
        default: ""
      dist-dir:
        type: string
        default: dist
      timeout-minutes:
        type: number
        # The timeout allows a cold compile-cache population to finish.
        # SwiftPM uses -explicit-module-build for the compile cache.
        # A cold cache build takes longer than an uncached build.
        # The first population must finish before the rolling cache can be saved.
        # Later builds replay the cache and finish well before the timeout.
        # Normal builds finish before the timeout.
        default: 60
      # Each macOS gate independently prefers local-pool-label when the broker at
      # local-pool-capacity-url reports available capacity.
      # Each gate otherwise uses inputs.runner.
      # The default URL uses the shared broker without consumer configuration.
      # An empty URL forces every gate to use a hosted runner.
      local-pool-capacity-url:
        type: string
        default: "https://darwin-gh-broker.silver-flare.com/capacity"
      # The workflow ignores local-pool-label when the pool is unavailable or
      # local-pool-capacity-url is empty.
      local-pool-label:
        type: string
        default: agk-local-macos-26
    secrets:
      # A repository supplies the certificates its builds use.
      # signing-identity-name selects the certificate for each build.
      # A repository supplies both certificates when CI and releases sign differently.
      #
      # CI runners that are not registered devices cannot use development provisioning.
      # CI builds on those runners use Apple Distribution with App Store profiles.
      # App Store profiles contain no device list.
      # Downloadable apps use Developer ID because they cannot use App Store signing.
      # Repositories with these CI and release builds supply both certificates.
      APPLE_DEVELOPER_ID_P12_BASE64:
        required: false
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        required: false
      APPLE_DISTRIBUTION_P12_BASE64:
        required: false
      APPLE_DISTRIBUTION_P12_PASSWORD:
        required: false
      APPLE_DEVELOPER_ID_PROFILE_BASE64:
        required: false
      # The consumer build reads the App Store Connect API key from the environment
      # for iOS automatic signing with `xcodebuild -allowProvisioningUpdates`.
      # Notarization in `_release.yml` uses the same environment variable names.
      # A build without the key does not perform automatic signing.
      # Simulator builds do not need automatic signing.
      APPLE_NOTARY_KEY_BASE64:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
      # The broker requires a bearer token for its guarded /capacity endpoint.
      # plan-runners authenticates capacity checks when the token and
      # local-pool-capacity-url are set.
      # The broker returns 401 when the token is missing or incorrect.
      # The gate uses a hosted runner after an authentication failure.
      # Capacity authentication failures never block CI.
      LOCAL_POOL_CAPACITY_TOKEN:
        required: false

env:
  # The swift-makefile bootstrap fetches swift.mk with `gh api`.
  # Every consumer needs GH_TOKEN because unauthenticated fetches fail silently.
  GH_TOKEN: ${{ github.token }}
  # GitHub's macOS runners include untrusted third-party taps.
  # The trust gate makes unrelated `brew install` and `brew update` calls
  # fail closed unless the job disables the gate.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  # The ci-diagnostics PR label turns on swift-mk debug logging across every job
  # in this workflow (changes, the aggregators, and anything else that runs
  # swift-mk). Empty keeps unlabeled runs at swift-mk's default quiet level. The
  # macOS system capture is added only inside the ci-gate action.
  SWIFT_MK_LOG_LEVEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-diagnostics') && 'debug' || '' }}
  # Each replayed compile reports the output file it served and its cache key.
  # Cache reports are the only way to measure a CI cache hit rate without
  # inferring the rate from elapsed time.
  # Compilation cache diagnostics are off by default because a warm build
  # emits one remark per replayed output.
  SWIFT_MK_SWIFTPM_CACHE_DIAGNOSTICS: ${{ contains(github.event.pull_request.labels.*.name, 'ci-diagnostics') && '1' || '' }}
  SWIFT_MK_XCODE_CACHE_DIAGNOSTICS: ${{ contains(github.event.pull_request.labels.*.name, 'ci-diagnostics') && '1' || '' }}

jobs:
  # Change detection frees one scarce macOS pool slot per run by using a free
  # Linux runner. `swift-mk ci-changed` diffs files with Git and classifies paths.
  # Generated-project consumers use the nil-graph path and need only Git.
  # The swift-makefile engine repository also runs `swift package describe`
  # with the container's Linux Swift toolchain.
  # Change detection needs no macOS toolchain.
  # Changes publishes the aggregate run output for Verify and Extra Targets.
  # Verify compiles and lints when either family changes.
  # Change detection does not depend on runner routing.
  # Each gate selects its runner at the gate's DAG boundary.
  #
  # The Linux swift-mk build is best-effort. The detect step always runs and
  # selects a full run with every output true when the binary is unavailable.
  # A transient Linux build failure keeps the job green and runs every gate.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    # The official Swift image includes Git and the Swift 6.3.x version line
    # used by macOS CI. Linux swift-mk builds and `swift package describe`
    # require no toolchain installation. actions/checkout and actions/cache
    # run unchanged inside the container.
    container: swift:6.3
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # SwiftPM and the cache action need one absolute literal cache path
      # because the cache action's tilde expansion can differ from SwiftPM's HOME.
      # The container sets HOME to /github/home. SwiftPM honors XDG_CACHE_HOME
      # and stores its clone cache at $XDG_CACHE_HOME/org.swift.swiftpm. A
      # literal path is required here because the `runner` context is not available in a
      # job-level env; the container filesystem is shared across steps, so /tmp persists
      # for the whole job.
      XDG_CACHE_HOME: /tmp/swiftpm-cache
      # The job overrides the workflow-level SWIFT_MK_LOG_LEVEL so the detector always
      # logs diff-base selection, git diff, build-graph reading, and classification.
      # The workflow-level value is empty unless the run is labeled.
      # The ci-diagnostics label enables per-git-call debug logs.
      # The reusable gate uses the same ci-diagnostics expression.
      SWIFT_MK_LOG_LEVEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-diagnostics') && 'debug' || 'info' }}
    permissions:
      contents: read
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # actions/checkout persists credentials by default.
          # The detector's feature-branch merge-base calculation can require
          # `git fetch origin <default>`.
          # A fetch without authentication fails in private repositories and disables
          # skipping on feature branches.
          fetch-depth: 0

      - name: Trust the workspace for git
        shell: bash
        # actions/checkout writes trees as the runner UID in this root container.
        # Git rejects later operations with "detected dubious ownership" because
        # checkout marks the working tree safe only in its temporary HOME.
        # The ownership check blocks the detector's merge-base and diff calls and the
        # engine checkout's build.
        # The wildcard trusts the workspace and the .swift-makefile engine checkout.
        # The container is CI-controlled and discarded after the job.
        run: git config --global --add safe.directory '*'

      - name: Cache SwiftPM dependency resolution
        uses: actions/cache@v6
        with:
          # The detect step's `swift package describe` resolves the repository's graph
          # and clones every dependency over the network when the cache is cold.
          # Resolution is the slow part of the changes job and sometimes stalls.
          # SwiftPM reuses cached clones during resolution instead of cloning
          # dependencies over the network.
          # XDG_CACHE_HOME and the cache action use the same literal location.
          # The manifest hash rotates the cache key after a dependency change.
          # restore-keys restores the previous cache after a manifest change.
          # SwiftPM updates cached clones instead of cloning into an empty cache.
          # Because swift-makefile ignores Package.resolved, hashFiles uses
          # Package.swift alone there.
          path: /tmp/swiftpm-cache/org.swift.swiftpm
          key: swiftpm-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            swiftpm-deps-${{ runner.os }}-${{ runner.arch }}-

      # One checkout path lets one setup step build swift-mk for the engine and
      # consumers.
      # A step's uses: field cannot take an expression.
      # The checkout uses github.sha for agoodkind/swift-makefile and main otherwise.
      # Engine pull requests run the setup action from the pull request.
      # The single setup step replaces two steps guarded by github.repository.
      - name: Check out the swift-makefile engine
        uses: actions/checkout@v7
        with:
          repository: agoodkind/swift-makefile
          ref: ${{ github.repository == 'agoodkind/swift-makefile' && github.sha || 'main' }}
          path: .swift-makefile
          fetch-depth: 1

      # Setup obtains Linux swift-mk from the cache, a release asset, or a source
      # build. Setup fails on apt errors, non-404 HTTP statuses, checksum
      # mismatches, and build failures.
      # Setup builds from source without failing on a 404 for an unpublished asset.
      # Detect provides the only recovery by defaulting to full CI when Setup
      # produces no usable binary. Downstream gates run even if Setup fails.
      - name: Setup Linux swift-mk
        uses: ./.swift-makefile/.github/actions/setup-linux-swift-mk

      - name: Detect changes
        id: detect
        # Detection defaults to full CI when Setup fails to provide a usable
        # binary.
        if: ${{ always() }}
        shell: bash
        env:
          # Pull requests have an empty github.event.before.
          # Pull requests use a merge ref (<n>/merge) in github.ref_name.
          # Pull requests use a synthetic merge commit in github.sha.
          # The pull request's head SHA, base branch, and head branch let the detector
          # compare the branch head with its base through the merge-base path.
          # Push events have empty pull request fields.
          SWIFT_MK_EVENT_NAME: ${{ github.event_name }}
          SWIFT_MK_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SWIFT_MK_DIFF_BASE: ${{ github.event.before }}
          SWIFT_MK_DEFAULT_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
          SWIFT_MK_REF_NAME: ${{ github.head_ref || github.ref_name }}
          SWIFT_MK_CI_EXTRA_DIRS: ${{ inputs.extra-dirs }}
        run: |
          set -uo pipefail

          # The detector exits 0 and writes outputs on success.
          # The detector defaults all outputs to true when internal detection fails.
          # Only a missing or non-runnable binary triggers the fallback.
          # The fallback is the only recovery when Setup produces no usable binary.
          # Direct invocation triggers the fallback for a missing binary without a
          # mode check.
          bin="${SWIFT_MK_BIN:-${HOME}/.swift-mk-ci-toolchain/swift-mk}"
          if "${bin}" ci-changed; then
            exit 0
          fi

          echo "change detection unavailable; running full CI"
          {
            printf 'run=true\n'
            printf 'changed=true\n'
          } >> "${GITHUB_OUTPUT}"

  # Verify runs the configured build and test before source-only lint gates
  # check that build.
  # The build-with-tests and test-without-building pair compiles the product
  # once. Without configured verify commands, the normal build and test
  # compile the product twice.
  route-verify:
    name: Route Verify Job
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref_name != github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      label: ${{ steps.route-local.outputs.label || steps.route-remote.outputs.label }}
      on_pool: ${{ steps.route-local.outputs.on_pool || steps.route-remote.outputs.on_pool }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
      - name: Plan runner (swift-makefile)
        id: route-local
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        uses: ./.github/actions/plan-runner
        with:
          runner: ${{ inputs.runner }}
          local-pool-capacity-url: ${{ needs.changes.outputs.run == 'false' && '' || inputs.local-pool-capacity-url }}
          local-pool-label: ${{ inputs.local-pool-label }}
          capacity-token: ${{ secrets.LOCAL_POOL_CAPACITY_TOKEN }}
      - name: Plan runner
        id: route-remote
        if: ${{ github.repository != 'agoodkind/swift-makefile' }}
        uses: agoodkind/swift-makefile/.github/actions/plan-runner@main
        with:
          runner: ${{ inputs.runner }}
          local-pool-capacity-url: ${{ needs.changes.outputs.run == 'false' && '' || inputs.local-pool-capacity-url }}
          local-pool-label: ${{ inputs.local-pool-label }}
          capacity-token: ${{ secrets.LOCAL_POOL_CAPACITY_TOKEN }}

  # verify-pool runs the first attempt on the planned pool or hosted runner.
  # verify-hosted retries failed or cancelled verification on a hosted runner.
  # A pool runner that disconnects mid-job ends as cancelled.
  # verify aggregates results into the single required Verify status check.
  verify-pool:
    name: Verify (${{ needs.changes.outputs.run == 'false' && 'skipped' || (needs.route-verify.outputs.on_pool == 'true' && 'self-hosted' || 'github-hosted') }})
    needs: [route-verify, changes]
    # !cancelled() lets verify-pool run when changes fails.
    # An empty run value requests full CI.
    # Requiring route-verify success prevents an undefined runs-on value.
    # A routing failure produces a Verify failure instead of an empty runner
    # label.
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref_name != github.event.repository.default_branch) && needs.route-verify.result == 'success' }}
    # A docs-only push with an index-confirmed skip uses Ubuntu to avoid
    # occupying a macOS pool slot.
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest' || needs.route-verify.outputs.label }}
    timeout-minutes: ${{ (inputs.release-dry-run && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') && inputs.release-timeout-minutes || inputs.timeout-minutes }}
    permissions:
      contents: read
      # The gate publishes one check run per stage when the release dry run is on.
      checks: write
    steps:
      - uses: actions/checkout@v7
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - name: Run CI gate (swift-makefile)
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        uses: ./.github/actions/ci-gate
        with: &verify-pool-inputs
          gate: verify
          runner: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest' || needs.route-verify.outputs.label }}
          run: ${{ needs.changes.outputs.run }}
          release-dry-run: ${{ inputs.release-dry-run }}
          # Fork pull requests receive no secrets. Dependabot reads its own secret set.
          # Neither can run a signed stage.
          # The gate still runs staged verification and reports Release dry run as
          # skipped for fork and Dependabot pull requests.
          # Every pull request reports the same four checks required by the ruleset.
          sign-release: ${{ inputs.release-dry-run && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          notarize-pattern: ${{ inputs.notarize-pattern }}
          dist-dir: ${{ inputs.dist-dir }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          xcode-version: ${{ inputs.xcode-version }}
          cache-profile: ${{ inputs.cache-profile }}
          cache-version: ${{ inputs.cache-version }}
          extra-cache-paths: ${{ inputs.extra-cache-paths }}
          brew-packages: ${{ inputs.brew-packages }}
          # A release-dry-run consumer requests signing for the release stage.
          # Signing preflight fails a fork before the build if signing remains enabled
          # when the release stage cannot run.
          # Consumers without release-dry-run use their configured signing values.
          import-signing-cert: ${{ inputs.import-signing-cert && (!inputs.release-dry-run || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
          install-provisioning-profile: ${{ inputs.install-provisioning-profile && (!inputs.release-dry-run || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
          signing-identity-name: ${{ inputs.signing-identity-name }}
          release-signing-identity-name: ${{ inputs.release-signing-identity-name }}
          apple-team-id: ${{ inputs.apple-team-id }}
          setup-target: ${{ inputs.setup-target }}
          make-args: ${{ inputs.make-args }}
          fetch-depth: ${{ inputs.fetch-depth }}
          apple-developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-distribution-p12-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          apple-distribution-p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          apple-developer-id-profile-base64: ${{ secrets.APPLE_DEVELOPER_ID_PROFILE_BASE64 }}
          apple-notary-key-base64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          apple-notary-key-id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple-notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      - name: Run CI gate
        if: ${{ github.repository != 'agoodkind/swift-makefile' }}
        uses: agoodkind/swift-makefile/.github/actions/ci-gate@main
        with: *verify-pool-inputs

  verify-hosted:
    name: Verify (github-hosted retry)
    needs: [route-verify, verify-pool]
    # !cancelled() defeats GitHub's implicit skip so the fallback runs whenever the
    # pool attempt did not succeed and the run is still alive; on_pool gates it to
    # pool-routed runs. `!= 'success'` covers failed and skipped pool attempts. When
    # the whole run is cancelled by a newer push or the pool watchdog, this job and
    # the aggregators skip so the run cancels cleanly and ci-infra-retry.yml reruns.
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref_name != github.event.repository.default_branch) && needs.route-verify.outputs.on_pool == 'true' && needs.verify-pool.result != 'success' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ (inputs.release-dry-run && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') && inputs.release-timeout-minutes || inputs.timeout-minutes }}
    permissions:
      contents: read
      # The gate publishes one check run per stage when the release dry run is on.
      checks: write
    steps:
      - uses: actions/checkout@v7
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - name: Run CI gate (swift-makefile)
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        uses: ./.github/actions/ci-gate
        with: &verify-hosted-inputs
          gate: verify
          runner: ${{ inputs.runner }}
          release-dry-run: ${{ inputs.release-dry-run }}
          # See the pool attempt's note on holding the signed stage off a fork or
          # a Dependabot pull request.
          sign-release: ${{ inputs.release-dry-run && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          notarize-pattern: ${{ inputs.notarize-pattern }}
          dist-dir: ${{ inputs.dist-dir }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          xcode-version: ${{ inputs.xcode-version }}
          cache-profile: ${{ inputs.cache-profile }}
          cache-version: ${{ inputs.cache-version }}
          extra-cache-paths: ${{ inputs.extra-cache-paths }}
          brew-packages: ${{ inputs.brew-packages }}
          import-signing-cert: ${{ inputs.import-signing-cert && (!inputs.release-dry-run || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
          install-provisioning-profile: ${{ inputs.install-provisioning-profile && (!inputs.release-dry-run || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
          signing-identity-name: ${{ inputs.signing-identity-name }}
          release-signing-identity-name: ${{ inputs.release-signing-identity-name }}
          apple-team-id: ${{ inputs.apple-team-id }}
          setup-target: ${{ inputs.setup-target }}
          make-args: ${{ inputs.make-args }}
          fetch-depth: ${{ inputs.fetch-depth }}
          apple-developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-distribution-p12-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          apple-distribution-p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          apple-developer-id-profile-base64: ${{ secrets.APPLE_DEVELOPER_ID_PROFILE_BASE64 }}
          apple-notary-key-base64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          apple-notary-key-id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple-notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      - name: Run CI gate
        if: ${{ github.repository != 'agoodkind/swift-makefile' }}
        uses: agoodkind/swift-makefile/.github/actions/ci-gate@main
        with: *verify-hosted-inputs

  verify:
    name: Verify
    # Verify reports the required check on live runs except default-branch pushes.
    # The !cancelled() guard permits Verify after failed or skipped dependencies.
    # Superseded or watchdog-cancelled runs skip Verify to cancel cleanly.
    # ci-infra-retry.yml can rerun cancelled workflows on hosted runners.
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref_name != github.event.repository.default_branch) }}
    needs: [verify-pool, verify-hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check verify result
        env:
          POOL_RESULT: ${{ needs.verify-pool.result }}
          HOSTED_RESULT: ${{ needs.verify-hosted.result }}
        run: |
          if [[ "${POOL_RESULT}" == "success" ]] || [[ "${HOSTED_RESULT}" == "success" ]]; then
            printf 'Verify passed (pool=%s, hosted=%s)\n' "${POOL_RESULT}" "${HOSTED_RESULT}"
          elif [[ "${POOL_RESULT}" == "skipped" ]] && [[ "${HOSTED_RESULT}" == "skipped" ]]; then
            printf 'Verify skipped (pool=skipped, hosted=skipped); routing or an upstream step failed\n' >&2
            exit 1
          else
            printf 'Verify failed (pool=%s, hosted=%s)\n' "${POOL_RESULT}" "${HOSTED_RESULT}" >&2
            exit 1
          fi

  # extra-targets-pool runs the first attempt on the planned pool or hosted runner.
  # extra-targets-hosted retries failed, cancelled, or skipped pool attempts on
  # hosted runners while the workflow is active.
  # A disconnected pool runner ends as cancelled.
  # extra-targets provides the single required status check for both attempts.
  # With no bespoke targets, extra-targets-pool runs without executing targets,
  # and extra-targets-hosted skips.
  route-extra-targets:
    name: Route Extra Targets Job
    needs: [changes, verify]
    # !cancelled() overrides GitHub's implicit skip after Verify finishes.
    # A cancelled run skips this job.
    # The needs.verify.result == 'success' condition requires Verify to succeed.
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref_name != github.event.repository.default_branch) && needs.verify.result == 'success' && (inputs.extra-targets != '[]' || inputs.targets != '["lint","build","test","audit"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      label: ${{ steps.route-local.outputs.label || steps.route-remote.outputs.label }}
      on_pool: ${{ steps.route-local.outputs.on_pool || steps.route-remote.outputs.on_pool }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
      - name: Plan runner (swift-makefile)
        id: route-local
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        uses: ./.github/actions/plan-runner
        with:
          runner: ${{ inputs.runner }}
          local-pool-capacity-url: ${{ needs.changes.outputs.run == 'false' && '' || inputs.local-pool-capacity-url }}
          local-pool-label: ${{ inputs.local-pool-label }}
          capacity-token: ${{ secrets.LOCAL_POOL_CAPACITY_TOKEN }}
      - name: Plan runner
        id: route-remote
        if: ${{ github.repository != 'agoodkind/swift-makefile' }}
        uses: agoodkind/swift-makefile/.github/actions/plan-runner@main
        with:
          runner: ${{ inputs.runner }}
          local-pool-capacity-url: ${{ needs.changes.outputs.run == 'false' && '' || inputs.local-pool-capacity-url }}
          local-pool-label: ${{ inputs.local-pool-label }}
          capacity-token: ${{ secrets.LOCAL_POOL_CAPACITY_TOKEN }}

  extra-targets-pool:
    # GitHub Actions evaluates the dynamic name in the checks list when
    # extra-targets-pool runs after successful or skipped routing.
    # GitHub Actions displays raw ${{ }} text for a skipped job's name.
    # extra-targets-pool performs no work on Ubuntu when routing skips because no
    # bespoke targets exist or a gate did not pass.
    # extra-targets-pool performs the requested work on the routed runner when
    # routing succeeds and the detector output is not 'false'.
    # The aggregator reports a failure when routing fails.
    # verify-pool also skips after a routing failure.
    name: Extra Targets (${{ (needs.route-extra-targets.result != 'success' || needs.changes.outputs.run == 'false') && 'skipped' || (needs.route-extra-targets.outputs.on_pool == 'true' && 'self-hosted' || 'github-hosted') }})
    needs: [route-extra-targets, changes, verify]
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref_name != github.event.repository.default_branch) && (needs.route-extra-targets.result == 'success' || needs.route-extra-targets.result == 'skipped') }}
    # The Ubuntu fallback prevents runs without bespoke targets from occupying
    # a macOS pool slot.
    runs-on: ${{ (needs.route-extra-targets.result == 'success' && needs.changes.outputs.run != 'false') && needs.route-extra-targets.outputs.label || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - name: Run CI gate (swift-makefile)
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        uses: ./.github/actions/ci-gate
        with: &extra-targets-pool-inputs
          gate: extra-targets
          runner: ${{ (needs.route-extra-targets.result == 'success' && needs.changes.outputs.run != 'false') && needs.route-extra-targets.outputs.label || 'ubuntu-latest' }}
          # The gate performs no work when routing skips because no bespoke targets
          # exist or a gate did not pass.
          # The gate runs when the detector output is empty to preserve the detector's
          # fail-safe behavior.
          # The other gates also run when the detector output is empty.
          run: ${{ needs.route-extra-targets.result != 'success' && 'false' || needs.changes.outputs.run }}
          extra-targets: ${{ inputs.extra-targets }}
          targets: ${{ inputs.targets }}
          xcode-version: ${{ inputs.xcode-version }}
          cache-profile: ${{ inputs.cache-profile }}
          cache-version: ${{ inputs.cache-version }}
          extra-cache-paths: ${{ inputs.extra-cache-paths }}
          brew-packages: ${{ inputs.brew-packages }}
          import-signing-cert: ${{ inputs.import-signing-cert }}
          install-provisioning-profile: ${{ inputs.install-provisioning-profile }}
          signing-identity-name: ${{ inputs.signing-identity-name }}
          release-signing-identity-name: ${{ inputs.release-signing-identity-name }}
          apple-team-id: ${{ inputs.apple-team-id }}
          setup-target: ${{ inputs.setup-target }}
          make-args: ${{ inputs.make-args }}
          fetch-depth: ${{ inputs.fetch-depth }}
          apple-developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-distribution-p12-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          apple-distribution-p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          apple-developer-id-profile-base64: ${{ secrets.APPLE_DEVELOPER_ID_PROFILE_BASE64 }}
          apple-notary-key-base64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          apple-notary-key-id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple-notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      - name: Run CI gate
        if: ${{ github.repository != 'agoodkind/swift-makefile' }}
        uses: agoodkind/swift-makefile/.github/actions/ci-gate@main
        with: *extra-targets-pool-inputs

  extra-targets-hosted:
    name: Extra Targets (github-hosted retry)
    needs: [route-extra-targets, extra-targets-pool]
    # !cancelled() overrides GitHub's implicit skip.
    # The hosted retry requires an unsuccessful pool attempt on a pool-routed run.
    # A cancelled run skips the hosted retry.
    # The if: checks extra targets inline because the reusable planner has no
    # output for that configuration.
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref_name != github.event.repository.default_branch) && (inputs.extra-targets != '[]' || inputs.targets != '["lint","build","test","audit"]') && needs.route-extra-targets.outputs.on_pool == 'true' && needs.extra-targets-pool.result != 'success' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - name: Run CI gate (swift-makefile)
        if: ${{ github.repository == 'agoodkind/swift-makefile' }}
        uses: ./.github/actions/ci-gate
        with: &extra-targets-hosted-inputs
          gate: extra-targets
          runner: ${{ inputs.runner }}
          extra-targets: ${{ inputs.extra-targets }}
          targets: ${{ inputs.targets }}
          xcode-version: ${{ inputs.xcode-version }}
          cache-profile: ${{ inputs.cache-profile }}
          cache-version: ${{ inputs.cache-version }}
          extra-cache-paths: ${{ inputs.extra-cache-paths }}
          brew-packages: ${{ inputs.brew-packages }}
          import-signing-cert: ${{ inputs.import-signing-cert }}
          install-provisioning-profile: ${{ inputs.install-provisioning-profile }}
          signing-identity-name: ${{ inputs.signing-identity-name }}
          release-signing-identity-name: ${{ inputs.release-signing-identity-name }}
          apple-team-id: ${{ inputs.apple-team-id }}
          setup-target: ${{ inputs.setup-target }}
          make-args: ${{ inputs.make-args }}
          fetch-depth: ${{ inputs.fetch-depth }}
          apple-developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-distribution-p12-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          apple-distribution-p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          apple-developer-id-profile-base64: ${{ secrets.APPLE_DEVELOPER_ID_PROFILE_BASE64 }}
          apple-notary-key-base64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          apple-notary-key-id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple-notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      - name: Run CI gate
        if: ${{ github.repository != 'agoodkind/swift-makefile' }}
        uses: agoodkind/swift-makefile/.github/actions/ci-gate@main
        with: *extra-targets-hosted-inputs

  extra-targets:
    name: Extra Targets
    # !cancelled() lets the aggregator run after failed or skipped dependencies.
    # A cancelled run skips the aggregator.
    # ci-infra-retry.yml reruns the workflow after cancellation.
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref_name != github.event.repository.default_branch) }}
    needs: [extra-targets-pool, extra-targets-hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check extra-targets result
        env:
          POOL_RESULT: ${{ needs.extra-targets-pool.result }}
          HOSTED_RESULT: ${{ needs.extra-targets-hosted.result }}
        # extra-targets-pool succeeds without running bespoke targets when no bespoke
        # targets exist or a gate did not pass.
        # extra-targets-pool skips when route-extra-targets fails or is cancelled.
        # The aggregator passes when the pool or hosted retry succeeds.
        # The aggregator fails otherwise.
        # A bespoke target that fails on both attempts fails the aggregator.
        run: |
          if [[ "${POOL_RESULT}" == "success" ]] || [[ "${HOSTED_RESULT}" == "success" ]]; then
            printf 'Extra Targets passed (pool=%s, hosted=%s)\n' "${POOL_RESULT}" "${HOSTED_RESULT}"
          else
            printf 'Extra Targets failed (pool=%s, hosted=%s)\n' "${POOL_RESULT}" "${HOSTED_RESULT}" >&2
            exit 1
          fi
