name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-track:
        description: Release track.
        required: false
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      candidate-tag:
        description: Published pre-release tag to promote.
        required: false
        type: string
      source-sha:
        description: Emergency source commit SHA.
        required: false
        type: string
      allow-source-sha:
        description: Acknowledge emergency source SHA promotion.
        required: true
        default: false
        type: boolean
      candidate-asset-pattern:
        description: Candidate release asset required for stable promotion.
        required: false
        default: swift-mk-engine_darwin_arm64.dmg
        type: string

# One concurrency group per ref. Every run this workflow now takes is a real
# release, so none of them cancels an in-flight publish. The signed dry run moved
# into CI's Verify job and is no longer triggered here.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The caller must grant every permission the called workflow's jobs request,
# even for steps an input disables; the validation is static.
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    # name: swift makes the reusable-workflow check read `Release / swift / <job>`,
    # matching CI's `CI / swift / <job>` and dropping the `Release / release`
    # doubling. The job id stays `release`; only the displayed segment changes.
    name: swift
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/_release.yml
    with:
      ephemeral: ${{ github.event_name == 'pull_request' }}
      release-track: ${{ github.event_name == 'pull_request' && 'prerelease' || github.event_name == 'workflow_dispatch' && inputs.release-track || '' }}
      release-on-merge: stable
      candidate-tag: ${{ inputs.candidate-tag }}
      source-sha: ${{ inputs.source-sha }}
      allow-source-sha: ${{ inputs.allow-source-sha || false }}
      # candidate-asset-pattern sets the asset a candidate pre-release must contain
      # before manual stable promotion. Its default is now
      # swift-mk-engine_darwin_arm64.dmg. Earlier releases, such as 26.10.10,
      # contain only swift-mk_darwin_arm64.dmg. resolve.sh lists the candidate
      # release assets and rejects candidates that do not contain a matching asset:
      # "candidate-tag does not contain an asset matching <pattern>".
      candidate-asset-pattern: ${{ inputs.candidate-asset-pattern || 'swift-mk-engine_darwin_arm64.dmg' }}
      # notarize-pattern is "*.dmg". The notarize job notarizes and staples every
      # matching dist file, including swift-mk-maint_darwin_arm64.dmg and
      # swift-mk-engine_darwin_arm64.dmg. The unsigned source tarball does not
      # match the pattern. A dmg supports a stapled notarization ticket, but a bare
      # command-line binary does not.
      notarize-pattern: "*.dmg"
      # The identity and team come from repository variables so a certificate or
      # team change is one settings edit, not a commit in every repository that
      # calls this workflow. The two certificates keep separate variables because
      # a release signs Developer ID while an unregistered CI runner signs Apple
      # Distribution, and one shared slot for both was a defect once already.
      signing-identity-name: ${{ vars.APPLE_DEVELOPER_ID_IDENTITY }}
      apple-team-id: ${{ vars.APPLE_TEAM_ID }}
      # smoke-asset sets the release asset that the post-publish job checks with
      # swift-mk verify-release. smoke-binary sets the executable inside that dmg.
      # swift-mk verify-release downloads the dmg, mounts it, checks the code
      # signature, and runs the binary with the version argument. It fails the job
      # if the binary does not run or does not print the release tag.
      # The check uses swift-mk-maint_darwin_arm64.dmg because swift-mk-maint
      # loads only operating system libraries. The swift-mk engine binary in
      # swift-mk-engine_darwin_arm64.dmg loads libIndexStore.dylib through an
      # rpath entry that records the build host's Xcode toolchain path.
      # A post-publish runner with Xcode at a different path cannot launch
      # the engine binary. The post-publish check does not use the engine dmg
      # for that reason.
      smoke-asset: swift-mk-maint_darwin_arm64.dmg
      smoke-binary: swift-mk-maint
    secrets: inherit
