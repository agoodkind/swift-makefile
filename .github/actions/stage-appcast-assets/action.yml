name: Stage appcast assets
description: Stage one generated appcast while preserving the live sibling release track.

inputs:
  release-track:
    description: Release track generated by the current workflow.
    required: true
  appcast-source:
    description: Path to the generated appcast.
    required: true
  public-directory:
    description: Worker static asset directory.
    required: true
  stable-feed-url:
    description: Public stable appcast URL.
    required: true
  prerelease-feed-url:
    description: Public pre-release appcast URL.
    required: true

runs:
  using: composite
  steps:
    - name: Stage appcast assets
      shell: bash
      env:
        APPCAST_SOURCE: ${{ inputs.appcast-source }}
        PRERELEASE_FEED_URL: ${{ inputs.prerelease-feed-url }}
        PUBLIC_DIRECTORY: ${{ inputs.public-directory }}
        RELEASE_TRACK: ${{ inputs.release-track }}
        STABLE_FEED_URL: ${{ inputs.stable-feed-url }}
      run: bash "${GITHUB_ACTION_PATH}/stage-appcast-assets.sh"
